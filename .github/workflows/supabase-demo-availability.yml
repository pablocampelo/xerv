name: Supabase demo availability
on:
  schedule:
    - cron: '17 6,14,22 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: supabase-demo-availability
  cancel-in-progress: false
jobs:
  database-activity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check token is configured
        env:
          TOKEN: ${{ secrets.SUPABASE_MANAGEMENT_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Configure SUPABASE_MANAGEMENT_TOKEN in Actions secrets."
            exit 1
          fi
      - name: Execute a read-only PostgreSQL query
        env:
          TOKEN: ${{ secrets.SUPABASE_MANAGEMENT_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          response="$(mktemp)"
          status="$(curl --silent --show-error --retry 2 --retry-delay 3 --max-time 30 \
            --output "$response" --write-out '%{http_code}' \
            -X POST 'https://api.supabase.com/v1/projects/xrsldzesmlvjzcctxsbu/database/query/read-only' \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' \
            --data '{"query":"select 1 as alive"}')"
          if [ "$status" != '201' ]; then
            echo "::error::Supabase query returned HTTP $status"
            exit 1
          fi
          jq -e 'type == "array" and .[0].alive == 1' "$response" >/dev/null || {
            echo "::error::Unexpected SQL response"
            exit 1
          }
          echo "PostgreSQL read-only query succeeded."
